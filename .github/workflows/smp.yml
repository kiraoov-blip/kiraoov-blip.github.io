name: SMP relay

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe = 접속/구조 진단만, fetch = 실제 수집"
        default: "probe"
        type: choice
        options: [probe, fetch]
  schedule:
    # 한국시간 18:07~22:52 사이 15분마다 (UTC 09~13시). 정각·15분 단위는 GitHub 부하로 건너뛰는 일이 잦아 어긋난 분으로 설정
    - cron: "7,22,37,52 9-13 * * *"
    # 한국시간 00:23, 06:53 (자정 직후·아침 보완)
    - cron: "23 15 * * *"
    - cron: "53 21 * * *"

permissions:
  contents: write

concurrency:
  group: smp-relay
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: 진단 (probe)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'probe'
        run: python fetch_smp.py --probe
      - name: 수집 (fetch)
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'fetch'
        run: python fetch_smp.py
      - name: 변경 사항 저장
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'fetch'
        run: |
          git config user.name "smp-relay"
          git config user.email "smp-relay@users.noreply.github.com"
          git add data/smp-jeju.json || true
          git diff --cached --quiet || (git commit -m "update SMP data" && git push)
